spring:
  application:
    name: catalogo-test
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

  cache:
    type: none

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: test_only_secret_key_not_for_production_0123456789
    ttl-minutes: 480
  admin:
    email: admin@test.com
    password: AdminPasswordTest123!
